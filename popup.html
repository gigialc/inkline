<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{font:13px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:14px;width:260px;color:#111;background:#fff}
  h1{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  h1 img{width:16px;height:16px}
  label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
  .stats{display:flex;gap:12px;margin:12px 0}
  .stat b{display:block;font-size:20px}
  .stat span{color:#6b7280;font-size:11px}
  ul{list-style:none;padding:0;margin:0}
  li{padding:6px 0;border-top:1px solid #f1f1f1;color:#374151}
  li small{color:#9ca3af;display:block}
  .empty{color:#9ca3af}
</style></head>
<body>
  <h1><img src="icons/icon48.png" alt="">Inkline <span style="color:#9ca3af;font-weight:normal;font-size:11px" id="ver"></span></h1>
  <label>Add receipt on send <input type="checkbox" id="enabled"></label>
  <div class="stats">
    <div class="stat"><b id="count">0</b><span>emails verified</span></div>
    <div class="stat"><b id="minutes">0</b><span>minutes writing</span></div>
  </div>
  <div id="last" style="font-size:12px;color:#6b7280;margin:-4px 0 10px"></div>
  <ul id="recent"></ul>
  <script src="popup.js"></script>
</body></html>
